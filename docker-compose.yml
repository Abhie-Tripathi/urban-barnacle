version: '3.9'

services:
  whr-db-dev:
    image: postgres:14-alpine
    restart: always
    ports:
      - 5434:5432
    env_file:
      - .env
    volumes:
      - /Users/sayyamaneja/Desktop/volumes/whr/whr-postgres-db:/var/lib/postgresql/data

  whr-redis:
    image: redis
    ports:
      - 6381:6379
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
